<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Number Guessing Game | COMP1073 Client-Side JavaScript</title>
		<link rel="stylesheet" href="css/guess.css" />
		
	</head>

	<body>
		<h1>Number Guessing Game</h1>
		<p>I have picked a random number between 1 and 1000. You have 10 chances to guess the number.</p>

		<!-- Guessing form controls -->
		<label for="guessField">Enter a guess: </label>
		<input type="number" id="guessField" min="1" max="1000">
		<button>Submit guess</button>

		<!-- Elements to contain feedback for user -->
		<section>
			<p id="guesses"></p>
			<p id="lastResult"></p>
			<p id="lowOrHi"></p>
		</section>

		<script>
			// DONE 1: Initialize game variables
			// DONE 1a: Pick random number
			// ? random is decimal between 0 and 1
			let randomNumber = Math.floor(Math.random() * 1000);
			// DONE 1b: Create variables to represent the three paragraphs above that will contain user feedback
			const guesses = document.querySelector("#guesses");
			const lastResult = document.querySelector("#lastResult");
			const lowOrHigh = document.querySelector("#lowOrHi");

			// DONE 1c: Create variables to represent the guessing form
			const guessField = document.querySelector("#guessField");
			const guessSubmit = document.querySelector("button");

			// DONE 1d: Create variables to initialize counter for number of guesses
			let guessCount = 0;
			// DONE 1e: Variable for reset button
			let resetButton;


			// DONE 2: Put focus on the field that allows user to type in guesses
			guessField.focus();

			// DONE 3: Build a function to check the user's guess
			function checkGuess() {
				// DONE 3b: Create a variable to contain what number the user entered
				let userGuess = Number(guessField.value);
				console.log(userGuess);
				// DONE 3c: If this is the first guess, add some text to the screen as a label for listing previous guesses for reference
				if (guessCount == 0) {
					guesses.textContent = "Previous guesses: ";
				}
				
				
				// DONE 3d: Add the user's current guess to that list, plus a space
				guesses.textContent += userGuess + " ";

				// DONE 985: Conditional - the user guessed an awesome number
				if (userGuess == 985) {
					lastResult.textContent = "Jerma";
					lastResult.style.backgroundColor = "blue";
				}
				
				// DONE 3e: Conditional - the user guessed correctly
				else if (userGuess == randomNumber) {
					// Output a success message, then end the game
					lastResult.textContent = "You guessed the number!";
					lastResult.style.backgroundColor = "green";
					lowOrHigh.textContent = "";
					setGameOver();
				}
				// DONE 3f: Conditional - the user is all out of guesses
				else if ( guessCount == 10 ) {
					// Output an appropriate message, then end the game
					lastResult.textContent = "you're a failure.";
					lastResult.style.backgroundColor = "red";

					setGameOver();
				}
				// DONE 3g: Conditional - the user's guess is incorrect
				else {
					// Output an appropriate message
					lastResult.textContent = "wrong.";
					lastResult.style.backgroundColor = "orange";
					
					// If the guess is too low, let the user know
					if(userGuess < randomNumber) {
						lowOrHigh.textContent = "too low";
					}
					
					// Else if the guess is too high, let the user know
					else {
						lowOrHigh.textContent = "too high";
					}
				}
				
				// DONE 3h: Increment the guess count, move focus to the guess field for the next guess, and clear out the old input
				guessCount += 1;
			}
			// DONE 4: Build a function called gameOver() to end the game
			function setGameOver() {
				// DONE 4a: Disable the guessing field and submit button
				guessField.disabled = true;
				guessSubmit.disabled = true;
				// DONE 4b: Change the textContent of the #lowOrHi paragraph to a short phrase indicating that the game is over, and that the user can start a new game by refreshing the browser page or tab
				lowOrHigh.textContent = "Game over";
				// DONE 4c: Create a new game button
				resetButton = document.createElement("button");
				document.body.append(resetButton);
				resetButton.textContent = "New Game";
				resetButton.addEventListener("click", resetGame);
			}
			// DONE 3a: Add an event listener for the guess form button that calls the checkGuess function, then test that the event listener is working and that it invokes the function
			// ? I believe by not putting the () after checkGuess, it's a reference, rather than an invoked method that would run when this line does.
			guessSubmit.addEventListener("click", checkGuess);
			// This page inspired by and adapted from https://developer.mozilla.org/en-US/docs/Learn/JavaScript/First_steps/A_first_splash

			//this was just copy pasted
			// STEP 5: Build a function to start a new game
			function resetGame() {
				// STEP 5a: Restore the guessCount variable to 1
				guessCount = 1;
				// STEP 5b: Clear out all the old messages in the paragraphs below the guessing form - this will need a loop
				const resetParas = document.querySelectorAll('section p');
				for (var i = 0 ; i < resetParas.length ; i++) {
					resetParas[i].textContent = '';
				}
				// STEP 5c: Remove the reset button
				resetButton.parentNode.removeChild(resetButton);
				// STEP 5d: Re-enable the guessing form, clear out any old input, then put focus on the field
				guessField.disabled = false;
				guessSubmit.disabled = false;
				guessField.value = '';
				guessField.focus();
				// STEP 5e: Change background color of lastResult paragraph back to white
				lastResult.style.backgroundColor = 'white';
				// STEP 5f: Generate a new random number
				randomNumber = Math.floor(Math.random() * 100) + 1;
			}
		</script>
	</body>
</html>
