<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>AWESOMER PIZZA!!!</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="css/normalize.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <script src="js/pizza.js" defer></script>
    </head>

    <body>
        <h1>AWESOMER PIZZA!!!</h1>
        <h2>Where pizza is made in an even more awesome way</h2>

        <!-- NOTE: this form was adapted from one of my previous assignmented in HTML-CSS-JS fundamentals -->
        <form action="" method="post">
            <h3>Customize Your Pizza!</h3>

            <!-- size: resizes the pizza visual accordingly -->
            <div>
                <h4>Size</h4>
                
                <input type="radio" name="size" id="small" value="Small" />
                <label for="small">Small</label>
                
                <!-- default -->
                <input type="radio" name="size" id="medium" value="Medium" checked/>
                <label for="medium">Medium</label>
                
                <input type="radio" name="size" id="large" value="Large" />
                <label for="large">Large</label>

                <input type="radio" name="size" id="party" value="Party" />
                <label for="party">PARTY!!</label>
            </div>

            <!-- toppings: adds these ontop of the pizza visual -->
            <div>
                <h4>Toppings</h4>

                <input type="checkbox" name="toppings[]" id="toppings1" value="Cheese" checked/>
                <label for="toppings1">Cheese</label>

                <input type="checkbox" name="toppings[]" id="toppings2" value="Pepperoni" />
                <label for="toppings2">Pepperoni</label>

                <input type="checkbox" name="toppings[]" id="toppings4" value="Spinach" />
                <label for="toppings4">Spinach</label>
                
                <input type="checkbox" name="toppings[]" id="toppings5" value="Pickles" />
                <label for="toppings5">Pickles</label>

                <input type="checkbox" name="toppings[]" id="toppings6" value="Egg" />
                <label for="toppings6">Egg</label>

                <input type="checkbox" name="toppings[]" id="toppings7" value="Carrots" />
                <label for="toppings7">Carrots</label>

                <input type="checkbox" name="toppings[]" id="toppings8" value="Sausage" />
                <label for="toppings8">Sausage</label>

                <!-- also "Secret" only accessible with inspect element -->
            </div>

            <!-- crust type: changes the main pizza image below all the toppings -->
            <div>
                <h4>Crust Type</h4>

                <select name="crust" id="crust">
                    <option value="Regular">Regular</option>
                    <option value="Thin">Thin Crust</option>
                    <option value="Deep">Deep Dish</option>
                    <option value="Evil">Evil Crust</option>
                </select>
            </div>

            <div>
                <label for="name">Name*</label>
                <input type="text" name="name" id="name" required />
            </div>

            <button type="submit" id="submit">Place Order</button>

            <div>
                <h4 id="error"></h4>
            </div>
        </form>

        <div>
            <div id="visuals">
                <!-- will be dynamically filled with img elements -->
            </div>
            <p id="desc"></p>
        </div>
    </body>
    <footer>
        <p>DYNAMICALLY ADD STUFF HERE</p>
    </footer>
</html>
