<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>See 'n' Say Storymaker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="css/normalize.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <script src="js/storymaker.js" defer></script>
    </head>

    <body>
        <h1>See 'n' Say Storymaker!</h1>
        <h3>Expansion Pack</h3>

        <table>
			<thead>
				<tr>
					<th>1</th>
					<th>2</th>
					<th>3</th>
					<th>4</th>
                    <th>5</th>
				</tr>
			</thead>
			<tbody>
                <tr>
                    <!-- td fields are created and filled out out dynamically with js -->
                    <!-- all index 0 fields are selected by default -->
					<td class="selected">loading...</td>
					<td class="selected"></td>
					<td class="selected"></td>
                    <td class="selected"></td>
                    <td class="selected"></td>
				</tr>

                <!-- more tr elements are created with js -->
			</tbody>
		</table>

        <div id="wordButtons">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
        </div>

        <button id="random">Randomize</button>
        <button id="submit">Playback</button>
        <h3 id="output">Press "Playback" to see your result!</h3>

        <footer><p>Zecheriah</p></footer>
    </body>
</html>
